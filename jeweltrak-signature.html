<!--
  HOW TO USE
  1. Upload the 6 image files to your website (or any image host) and replace the
     BASE URL below. Email clients need images hosted online with a full https:// link.
       logo.png        - JewelTrak logo (JT monogram + wordmark)
       icon-phone.png  - phone icon
       icon-email.png  - envelope icon
       icon-web.png    - globe icon
       icon-map.png    - location pin icon
       footer-wave.png - maroon / black wave footer
  2. Open this file in a browser, select all (Ctrl/Cmd + A), copy, and paste into your
     email client's signature box.
-->
